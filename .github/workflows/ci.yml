name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --release
      - name: Check a generated migration end to end
        shell: bash
        run: |
          cargo run --release -- gen --rows 5000 --out gen
          set +e
          cargo run --release -- check --source gen/legacy.csv --target gen/migrated.csv --contract gen/mapping.json --json gen/report.json --csv gen/findings.csv
          code=$?
          set -e
          test "$code" -eq 1
          test -s gen/report.json
          test -s gen/findings.csv
      - name: Draft a contract and check with it
        shell: bash
        run: |
          cargo run --release -- init --source gen/legacy.csv --target gen/migrated.csv --out gen/drafted.json
          set +e
          cargo run --release -- check --source gen/legacy.csv --target gen/migrated.csv --contract gen/drafted.json \
            --patch gen/fix.sql --table crm.customers --markdown "$GITHUB_STEP_SUMMARY" --quiet
          code=$?
          set -e
          test "$code" -eq 1
          grep -q '^UPDATE "crm"."customers"' gen/fix.sql
          grep -q '^COMMIT;' gen/fix.sql
